plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sitelock.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.sitelock.browser"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.5"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // iOS 26 风液态玻璃（折射+色散），Android 13+ 生效，低版本透明降级
    // 1.0.3 保持 minCompileSdk=1，兼容 compileSdk 34；1.0.4+ 要求 SDK 37
    implementation 'com.qmdeve.liquidglass:core:1.0.3'
}
